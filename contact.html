<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop | Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #fff3e0; margin: 0;">

    <nav style="background-color: #ef6c00; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; margin: 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: white; margin: 15px; text-decoration: none;">Sobre K-Pop</a>
        <a href="contact.html" style="color: white; margin: 15px; text-decoration: none;">Contacto</a>
    </nav>

    <main style="padding: 40px; max-width: 600px; margin: auto;">
        <h1 style="color: #e65100;">Contáctanos</h1>

        <p style="color: #555;">
            Si quieres compartir información, sugerencias o hablar
            sobre tus grupos favoritos de K-Pop, puedes escribirnos.
        </p>

        <form>
            <label style="display: block; margin-bottom: 5px;">Nombre:</label>
            <input type="text" style="width: 100%; padding: 10px; margin-bottom: 15px;">

            <label style="display: block; margin-bottom: 5px;">Correo:</label>
            <input type="email" style="width: 100%; padding: 10px; margin-bottom: 15px;">

            <label style="display: block; margin-bottom: 5px;">Mensaje:</label>
            <textarea style="width: 100%; height: 100px; padding: 10px; margin-bottom: 15px;"></textarea>

            <button type="submit" style="background-color: #ef6c00; color: white; padding: 10px 25px; border: none; cursor: pointer;">
                Enviar
            </button>
        </form>
    </main>

</body>
</html>
